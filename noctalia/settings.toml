[bar.default]
radius = 9
scale = 0.80000000447034836
shadow = false
thickness = 26

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[plugins]
enabled = []

[shell]
niri_overview_type_to_launch_enabled = true

[theme]
builtin = "Gruvbox"
community_palette = "Flexoki"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "niri" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"

    [wallpaper.last]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"

    [wallpaper.monitors.DP-1]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"
