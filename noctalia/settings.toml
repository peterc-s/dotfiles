[bar.default]
radius = 9
scale = 0.80000000447034836
shadow = false
thickness = 26
center = [ "clock", "launcher" ]
end = [
    "media",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
start = [ "workspaces", "cpu", "temp", "ram", "network_tx", "network_rx" ]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "audio"

[lockscreen]
fingerprint = false

[plugins]
enabled = []

[notification]
layer = "overlay"

[shell]
avatar_path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/detrimentalist.jpg"
niri_overview_type_to_launch_enabled = true
clipboard_enabled = false
clipboard_history_max_entries = 10
launch_apps_as_systemd_services = true

    [shell.animation]
    enabled = false

    [shell.panel]
    borders = false
    launcher_compact = true
    launcher_placement = "floating"
    open_near_click_control_center = true
    shadow = false

[theme]
builtin = "Gruvbox"
community_palette = "Flexoki"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "niri" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"

    [wallpaper.last]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"

    [wallpaper.monitors.DP-1]
    path = "/home/pete/repos/nixos-cfg/dotfiles/wallpapers/wlfgrl.png"

[weather]
enabled = false
